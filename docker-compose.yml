# Everything the bot needs: the bot itself (long polling, no open ports) and its own Postgres.
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tushlik:${POSTGRES_PASSWORD}@db:5432/tushlik
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 320m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tushlik
      POSTGRES_DB: tushlik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tushlik -d tushlik"]
      interval: 5s
      retries: 10
    mem_limit: 256m

volumes:
  pgdata:
